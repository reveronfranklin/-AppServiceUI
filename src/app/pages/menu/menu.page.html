<ion-menu contentId="content">

  <ion-header>
    <ion-toolbar color="primary">
      <ion-title> Menú</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>

    <div *ngFor="let p of pages">


      <ion-menu-toggle *ngIf="p.url">
        <ion-item [routerLink]="p.url" routerDirection="root" routerLinkActive="active">
          <ion-icon [name]="p.icon" slot="start"></ion-icon>
          <ion-label>
            {{ p.title }}
          </ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-item button *ngIf="p.children?.length > 0" (click)="p.open = !p.open" [class.active-parent]="p.open"
        detail="false">

        <ion-icon slot="start" name="arrow-forward" *ngIf="!p.open"></ion-icon>
        <ion-icon slot="start" name="arrow-down" *ngIf="p.open"></ion-icon>
        <ion-icon [name]="p.icon" slot="start"></ion-icon>

        <ion-label> {{ p.title }} </ion-label>
      </ion-item>

      <ion-list *ngIf="p.open">
        <ion-menu-toggle>

          <div *ngIf="p.tille !== IA">
            prueba
          </div>

          <ion-item class="sub-item" *ngFor="let sub of p.children" [routerLink]="sub.url" routerDirection="root"
            routerLinkActive="active">
            <ion-icon [name]="sub.icon" slot="start"></ion-icon>
            <ion-label>
              {{ sub.title }}
            </ion-label>
          </ion-item>
          <!-- Ítem para el chatbot que abre en nueva pestaña -->
          <ion-item class="sub-item" (click)="openChatbot()" button>
            <ion-icon name="chatbubble-ellipses-outline" slot="start"></ion-icon>
            <ion-label>
              ETI - Asistente de Etiquetas
            </ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>

    </div>
    <ion-item>
      <p>Version(0.1.96) Ambiente:TEST</p>
    </ion-item>
    <ion-item *ngIf="this.usuario!== null">
      <p>Usuario Conectado: {{this.usuario.user}}</p>
    </ion-item>

  </ion-content>

</ion-menu>

<ion-router-outlet id="content" main></ion-router-outlet>
