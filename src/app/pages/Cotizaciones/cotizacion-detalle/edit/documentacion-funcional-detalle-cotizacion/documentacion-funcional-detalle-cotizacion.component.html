<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Reglas funcionales</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()" aria-label="Cerrar documentacion funcional">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <section class="doc-intro">
    <h2>Detalle de cotizacion</h2>
    <p>
      Consulta rapida de las reglas funcionales aplicadas al crear o modificar
      productos dentro del detalle de una cotizacion.
    </p>
  </section>

  <ion-list lines="none">
    <ion-item-group *ngFor="let seccion of secciones">
      <ion-item-divider sticky="false">
        <ion-label>{{ seccion.titulo }}</ion-label>
      </ion-item-divider>

      <ion-item *ngFor="let regla of seccion.reglas" class="doc-rule">
        <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
        <ion-label>{{ regla }}</ion-label>
      </ion-item>
    </ion-item-group>
  </ion-list>
</ion-content>
